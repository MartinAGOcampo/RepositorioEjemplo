<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vela Animada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .vela {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cuerpo de la vela */
        .cuerpo {
            width: 50px;
            height: 150px;
            background-color: white;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        /* Pabilo (mecha) */
        .pabilo {
            width: 4px;
            height: 20px;
            background-color: black;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Llama */
        .llama {
            width: 30px;
            height: 50px;
            background: radial-gradient(circle, orange 40%, yellow 60%, transparent 100%);
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            animation: flame 1.5s infinite alternate ease-in-out;
            opacity: 0.9;
        }

        /* Animación de la llama */
        @keyframes flame {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 0.9;
            }
            50% {
                transform: translateX(-50%) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>
    <div class="vela">
        <div class="llama"></div>
        <div class="pabilo"></div>
        <div class="cuerpo"></div>
    </div>
</body>
</html>
